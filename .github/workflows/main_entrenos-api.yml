# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy ASP.Net Core app to Azure Web App - entrenos-api

on:
  push:
    branches:
      - 'main'
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/main_entrenos-api.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build front-end
        working-directory: frontend
        env:
          VITE_API_URL: /api
        run: |
          npm ci
          npm run build

      - name: Build with dotnet
        run: dotnet build backend/EntreNos.Api/EntreNos.Api.csproj --configuration Release

      - name: dotnet publish
        run: dotnet publish backend/EntreNos.Api/EntreNos.Api.csproj -c Release --no-build -o "${{env.DOTNET_ROOT}}/myapp"

      - name: Copy front-end to wwwroot
        run: |
          New-Item -ItemType Directory -Force "${{env.DOTNET_ROOT}}/myapp/wwwroot"
          Copy-Item -Recurse -Force frontend/dist/* "${{env.DOTNET_ROOT}}/myapp/wwwroot"

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ${{env.DOTNET_ROOT}}/myapp

  deploy:
    runs-on: windows-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_84ECDAEC6541405B81B800B5F6595E3D }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_BC04650D822C4724938761DC29FCA9B1 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_29217A3E2F254DE69CF6BDC6C7D0CAE6 }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'entrenos-api'
          slot-name: 'Production'
          package: .
